# Place this file at: .github/workflows/github-snake.yml
# in your username/username repo, then:
#   1. Go to the "Actions" tab of that repo
#   2. Enable workflows if prompted
#   3. Select "generate github-snake" → "Run workflow" (takes ~1 min)
# It regenerates the snake daily and publishes it to the "output" branch,
# which is what README.md's snake <img> tag points to.

name: generate github-snake

on:
  schedule:
    - cron: "0 0 * * *"   # runs once a day at midnight UTC
  workflow_dispatch: {}     # lets you trigger it manually from the Actions tab
  push:
    branches:
      - main

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: generate snake animation
        uses: Platane/snk@v3
        id: snake-gif
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark
            dist/github-contribution-grid-snake.gif?color_snake=%23A78BFA&color_dots=%2321262d,%23161b22,%2321262d,%23a78bfa,%236d28d9

      - name: push snake output to the output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
